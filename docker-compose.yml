services:
  kafka:
    image: apache/kafka:3.8.1
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
  influxdb:
    image: influxdb:2.7
    environment:
      DOCKER_INFLUXDB_INIT_MODE: setup
      DOCKER_INFLUXDB_INIT_USERNAME: admin
      DOCKER_INFLUXDB_INIT_PASSWORD: admin12345
      DOCKER_INFLUXDB_INIT_ORG: g09
      DOCKER_INFLUXDB_INIT_BUCKET: pipeline
      DOCKER_INFLUXDB_INIT_ADMIN_TOKEN: g09-token
    volumes:
      - influxdb-data:/var/lib/influxdb2

  api:
    build: .
    command: uvicorn src.app.main:app --host 0.0.0.0 --port 8000
    environment:
      PYTHONPATH: /app
      PIPELINE_RUNTIME_DIR: /runtime
      PUBLIC_PROMETHEUS_PORT: ${PROMETHEUS_PORT:-9090}
      PUBLIC_GRAFANA_PORT: ${GRAFANA_PORT:-3000}
    ports:
      - "${API_PORT:-5051}:8000"
    volumes:
      - ${RAW_DATA_DIR:-./data/raw}:/app/data/raw
      - ${PROCESSED_DATA_DIR:-./data/processed}:/app/data/processed
      - runtime-data:/runtime
    depends_on:
      - kafka
      - influxdb

  producer:
    build: .
    command: python -m src.app.producer
    environment:
      PYTHONPATH: /app
      PIPELINE_RUNTIME_DIR: /runtime
    volumes:
      - ${RAW_DATA_DIR:-./data/raw}:/app/data/raw
      - ${PROCESSED_DATA_DIR:-./data/processed}:/app/data/processed
      - runtime-data:/runtime
    depends_on:
      - kafka
      - api

  consumer:
    build: .
    command: python -m src.app.consumer
    environment:
      PYTHONPATH: /app
      PIPELINE_RUNTIME_DIR: /runtime
      INFLUX_URL: http://influxdb:8086
      INFLUX_TOKEN: g09-token
      INFLUX_ORG: g09
      INFLUX_BUCKET: pipeline
    volumes:
      - ${RAW_DATA_DIR:-./data/raw}:/app/data/raw
      - ${PROCESSED_DATA_DIR:-./data/processed}:/app/data/processed
      - runtime-data:/runtime
    depends_on:
      - kafka
      - influxdb
      - api

  prometheus:
    image: prom/prometheus:v2.53.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ${PROMETHEUS_CONFIG_FILE:-./observability/prometheus/prometheus.yml}:/etc/prometheus/prometheus.yml:ro
    depends_on:
      - api
      - consumer

  grafana:
    image: grafana/grafana:11.0.0
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    volumes:
      - ${GRAFANA_PROVISIONING_DIR:-./observability/grafana/provisioning}:/etc/grafana/provisioning:ro
      - ${GRAFANA_DASHBOARDS_DIR:-./observability/grafana/dashboards}:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus

volumes:
  influxdb-data:
  grafana-data:
  runtime-data:
